name: OpenWiki Update

# Manual-only. The daily `schedule:` OpenWiki generates is commented out on
# purpose: this job needs OPENROUTER_API_KEY, and until that secret exists a
# cron would fail every morning forever. Add the secret, then uncomment.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Without uv, OpenWiki cannot run this project's test suite and documents a
      # "could not verify" caveat instead of checking its claims.
      - name: Set up uv
        # Pinned to a commit SHA, matching the other actions here. A mutable tag
        # like @v9 can be repointed at arbitrary code by anyone who can push to
        # that repository, and this job holds contents:write + pull-requests:write.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.4"

      - name: Install OpenWiki
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: npm install --global openwiki@0.2.3 mermaid@11.16.0 jsdom@29.1.1

      # Needs a scoped API key. OpenWiki can also authenticate with a ChatGPT
      # subscription (OPENWIKI_PROVIDER=openai-chatgpt), but that credential is an
      # OAuth access/refresh pair for the whole account which expires and rotates,
      # so it does not belong in a public repository's Actions secrets. Use an
      # OpenRouter key here, or switch to OPENWIKI_PROVIDER=openai with
      # OPENAI_API_KEY. Day-to-day regeneration happens locally instead — see
      # the drift check in openwiki-drift-check.yml.
      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_MODEL_ID: z-ai/glm-5.2
          # LangSmith tracing disabled: it ships run traces to a third party and
          # needs another secret. Set these if you want it.
          # LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          # LANGCHAIN_PROJECT: openwiki
          # LANGCHAIN_TRACING_V2: "true"

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
